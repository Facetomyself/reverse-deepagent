[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-deepagent-strategy-detector-reference"
version = "0.1.0"
description = "Reference StrategyDetector plugin package for reverse-deepagent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "reverse-deepagent==0.1.0",
]

[project.entry-points."reverse_deepagent.strategy_detectors"]
reference-strategy-detector = "reverse_deepagent_strategy_detector_reference:strategy_detector_registration"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
