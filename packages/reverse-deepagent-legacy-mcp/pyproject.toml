[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-deepagent-legacy-mcp"
version = "0.1.0"
description = "Optional legacy JSReverser MCP runtime backend plugin for reverse-deepagent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "reverse-deepagent==0.1.0",
]

[project.entry-points."reverse_deepagent.runtime_backends"]
legacy-mcp = "reverse_deepagent_legacy_mcp:runtime_backend_registration"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
