[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-deepagent"
version = "0.1.0"
description = "Reverse-engineering oriented deepagents demo for Web / JS workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["deepagents", "reverse-engineering", "javascript", "web", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "deepagents==0.6.3",
  "langchain==1.3.1",
  "langchain-core==1.4.0",
  "langgraph==1.2.1",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
llm = [
  "langchain-openai>=0.3.0,<0.4",
]
scrapy = [
  "scrapy>=2.11,<3",
]
browser = [
  "playwright>=1.45,<2",
]

[project.scripts]
reverse-agent-demo = "reverse_deepagent.cli:main_demo"
reverse-agent-fixture = "reverse_deepagent.fixture_cli:main_fixture"
reverse-agent-fixture-smoke = "reverse_deepagent.fixture_smoke:main_fixture_smoke"
reverse-agent-platform = "reverse_deepagent.cli:main_platform"
reverse-agent-openai-smoke = "reverse_deepagent.openai_smoke:main"
reverse-agent-doctor = "reverse_deepagent.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reverse_deepagent = [
  "prompts/*.txt",
  "scripts/*.sh",
]

[project.urls]
Homepage = "https://github.com/Facetomyself/reverse-deepagent"
Repository = "https://github.com/Facetomyself/reverse-deepagent"
Issues = "https://github.com/Facetomyself/reverse-deepagent/issues"
Changelog = "https://github.com/Facetomyself/reverse-deepagent/blob/main/CHANGELOG.md"
